name: Deploy Med USC to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R "MedCalendar-v5.10-vista-semanal-movil/." _site/

          for file in \
            index.html \
            css/styles.css \
            js/app.js \
            manifest.webmanifest \
            service-worker.js \
            icons/icon-192.png \
            icons/icon-512.png \
            icons/apple-touch-icon.png \
            data/medicina-1-2026-2027.json \
            data/medicina-2-2026-2027.json \
            data/medicina-2-2026-2027-grupo-B.json \
            data/medicina-3-2026-2027.json \
            data/medicina-4-2026-2027.json \
            data/plantilla-horario.json \
            data/optativas-2026-2027.json \
            data/examenes-2026-2027.json
          do
            test -f "_site/$file"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
